<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Tracks | SoundWave</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">

</head>

<!-- Navigation -->    
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">SoundWave</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="products.html">Manage Tracks</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="signup.html">Join SoundWave</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <header class="library-hero text-center">
        <div class="container">
            <h1 class="display-5 fw-bold">Manage Tracks</h1>
            <p class="lead">
                Add your favorite songs, explore genres, and manage the library.
            </p>
        </div>
    </header>

    <main class="container my-5">

        <!-- Message area (success / error) -->
        <div id="message" class="alert d-none" role="alert"></div>

        <div class="row g-4">

            <!-- ===== Form ===== -->
            <div class="col-lg-4">
                <div class="card manage-card shadow-sm">
                    <div class="card-body">
                        <h2 class="h4 section-title mb-3" id="formTitle">Add a Track</h2>

                        <form id="trackForm" novalidate>

                            <div class="mb-3">
                                <label for="trackId" class="form-label">Track ID *</label>
                                <input type="text" class="form-control" id="trackId"
                                       placeholder="e.g. T005">
                                <div class="invalid-feedback" id="trackIdError"></div>
                            </div>

                            <div class="mb-3">
                                <label for="title" class="form-label">Title *</label>
                                <input type="text" class="form-control" id="title"
                                       placeholder="Song title">
                                <div class="invalid-feedback" id="titleError"></div>
                            </div>

                            <div class="mb-3">
                                <label for="category" class="form-label">Genre *</label>
                                <select class="form-select" id="category">
                                    <option value="">Choose a genre...</option>
                                    <option>Pop</option>
                                    <option>Hip-Hop</option>
                                    <option>Rock</option>
                                    <option>Country</option>
                                </select>
                                <div class="invalid-feedback" id="categoryError"></div>
                            </div>

                            <div class="mb-3">
                                <label for="format" class="form-label">Format *</label>
                                <select class="form-select" id="format">
                                    <option value="">Choose a format...</option>
                                    <option>Digital</option>
                                    <option>Vinyl</option>
                                    <option>CD</option>
                                </select>
                                <div class="invalid-feedback" id="formatError"></div>
                            </div>

                            <div class="mb-3">
                                <label for="price" class="form-label">Price ($) *</label>
                                <input type="text" class="form-control" id="price"
                                       placeholder="e.g. 1.29">
                                <div class="invalid-feedback" id="priceError"></div>
                            </div>

                            <div class="mb-3">
                                <label for="info" class="form-label">Artist / Duration (optional)</label>
                                <input type="text" class="form-control" id="info"
                                       placeholder="e.g. Luna Park - 3:42">
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-sw" id="submitBtn">Add Track</button>
                                <button type="button" class="btn btn-outline-secondary d-none" id="cancelBtn">
                                    Cancel
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>

            <!-- ===== Search + Table ===== -->
            <div class="col-lg-8">
                <div class="card manage-card shadow-sm">
                    <div class="card-body">

                        <h2 class="h4 section-title mb-3">Track Catalog</h2>

                        <div class="row g-2 mb-3">
                            <div class="col-md-8">
                                <input type="text" class="form-control" id="searchBox"
                                       placeholder="Search by ID, title, genre, format or artist...">
                            </div>
                            <div class="col-md-4">
                                <select class="form-select" id="genreFilter">
                                    <option value="">All genres</option>
                                    <option>Pop</option>
                                    <option>Hip-Hop</option>
                                    <option>Rock</option>
                                    <option>Country</option>
                                </select>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover align-middle" id="trackTable">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Title</th>
                                        <th>Genre</th>
                                        <th>Format</th>
                                        <th>Price</th>
                                        <th>Artist / Duration</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="trackBody"></tbody>
                            </table>
                        </div>

                        <p class="text-muted small mb-0" id="resultCount"></p>

                    </div>
                </div>
            </div>

        </div>
    </main>


    <!-- Footer -->
    <footer class="sw-footer text-white text-center py-3">
        <p class="mb-0">&copy; 2026 SoundWave Music Community</p>
    </footer>


    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Page script -->
    <script src="products.js"></script>

</body>
</html>
